<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>xljs</title>
<link rel="stylesheet" href="fontawesome/css/all.min.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="dev.css">
</head>
<body>
<header id="toolbar">
  <div class="script">
    <i class="fa-solid fa-file-code"></i>
    <span id="script-name"></span>
    <span id="script-dir" class="muted"></span>
  </div>
  <div class="group">
    <button type="button" id="btn-open" class="tool"><i class="fa-regular fa-folder-open"></i><span data-t="open"></span></button>
    <button type="button" id="btn-new" class="tool"><i class="fa-regular fa-file"></i><span data-t="new"></span></button>
    <button type="button" id="btn-folder" class="tool icon" data-tip="showFolder"><i class="fa-regular fa-folder"></i></button>
  </div>
  <div class="group">
    <button type="button" id="btn-run" class="tool run"><i class="fa-solid fa-play"></i><span data-t="run"></span></button>
    <button type="button" id="btn-debug" class="tool"><i class="fa-solid fa-bug"></i><span data-t="debugRun"></span></button>
    <button type="button" id="btn-stop" class="tool stop"><i class="fa-solid fa-stop"></i><span data-t="stop"></span></button>
  </div>
  <div class="group layout">
    <button type="button" id="lay-both" class="tool icon" data-tip="layoutBoth"><i class="fa-solid fa-table-columns"></i></button>
    <button type="button" id="lay-chat" class="tool icon" data-tip="layoutChat"><i class="fa-regular fa-comments"></i></button>
    <button type="button" id="lay-canvas" class="tool icon" data-tip="layoutCanvas"><i class="fa-solid fa-code"></i></button>
    <button type="button" id="lay-swap" class="tool icon" data-tip="layoutSwap"><i class="fa-solid fa-right-left"></i></button>
  </div>
</header>

<div id="panes">
  <section id="chat" class="pane">
    <div class="bar">
      <button type="button" id="chat-home" class="tool icon" data-tip="chatHome"><i class="fa-solid fa-house"></i></button>
      <button type="button" id="chat-back" class="tool icon" data-tip="back"><i class="fa-solid fa-arrow-left"></i></button>
      <button type="button" id="chat-forward" class="tool icon" data-tip="forward"><i class="fa-solid fa-arrow-right"></i></button>
      <button type="button" id="chat-reload" class="tool icon" data-tip="reload"><i class="fa-solid fa-rotate-right"></i></button>
      <input type="text" id="chat-url" spellcheck="false">
      <button type="button" id="chat-intro" class="tool" data-tip="introTip"><i class="fa-regular fa-clipboard"></i><span data-t="intro"></span></button>
    </div>
    <div id="chat-start" class="start">
      <h2 data-t="chatTitle"></h2>
      <p class="muted" data-t="chatLead"></p>
      <div id="services" class="services"></div>
      <form id="chat-url-form" class="url-row">
        <input type="text" id="chat-url-start" spellcheck="false">
        <button type="submit" data-t="go"></button>
      </form>
      <ol class="steps">
        <li data-t="step1"></li>
        <li data-t="step2"></li>
        <li data-t="step3"></li>
      </ol>
      <button type="button" id="chat-intro2"><i class="fa-regular fa-clipboard"></i> <span data-t="intro"></span></button>
      <p id="chat-failed" class="error-text" hidden></p>
    </div>
    <div id="chat-view"></div>
  </section>
  <div id="splitter"></div>
  <section id="canvas" class="pane">
    <nav id="tabs" class="tabs">
      <button type="button" data-tab="code"><i class="fa-solid fa-code"></i><span data-t="tabCode"></span></button>
      <button type="button" data-tab="diff"><i class="fa-solid fa-code-compare"></i><span data-t="tabDiff"></span><span id="diff-badge" class="badge" hidden>1</span></button>
      <button type="button" data-tab="preview"><i class="fa-regular fa-eye"></i><span data-t="tabPreview"></span></button>
      <button type="button" data-tab="history"><i class="fa-solid fa-clock-rotate-left"></i><span data-t="tabHistory"></span></button>
      <button type="button" data-tab="output"><i class="fa-solid fa-terminal"></i><span data-t="tabOutput"></span><span id="output-badge" class="badge error" hidden>!</span></button>
    </nav>

    <div id="welcome" class="panel start">
      <h2 data-t="welcomeTitle"></h2>
      <p class="muted" data-t="welcomeLead"></p>
      <div class="services">
        <button type="button" id="w-open" class="big"><i class="fa-regular fa-folder-open"></i><span data-t="openScript"></span></button>
        <button type="button" id="w-wizard" class="big"><i class="fa-solid fa-wand-magic-sparkles"></i><span data-t="wzStart"></span></button>
        <button type="button" id="w-port" class="big"><i class="fa-solid fa-file-excel"></i><span data-t="wzStartPort"></span></button>
      </div>
      <p class="muted small-links">
        <span data-t="templateOnly"></span>
        <button type="button" id="w-new" class="link" data-t="newScript"></button>
        <button type="button" id="w-new-app" class="link" data-t="newApp"></button>
      </p>
      <h3 data-t="recent" id="recent-title" hidden></h3>
      <ul id="recent" class="recent"></ul>
    </div>

    <div id="wizard" class="panel start wizard" hidden>
      <h2 data-t="wzTitle"></h2>
      <p class="muted" data-t="wzLead"></p>

      <section>
        <h3 data-t="wzKind"></h3>
        <label class="opt"><input type="radio" name="wz-kind" value="new" checked> <span data-t="wzKindNew"></span></label>
        <label class="opt"><input type="radio" name="wz-kind" value="port"> <span data-t="wzKindPort"></span></label>
      </section>

      <section class="port-only">
        <h3 data-t="wzBooks"></h3>
        <p class="muted" data-t="wzBooksLead"></p>
        <button type="button" id="wz-books"><i class="fa-regular fa-folder-open"></i> <span data-t="wzChooseBooks"></span></button>
        <ul id="wz-book-list" class="book-list"></ul>
        <label class="opt"><input type="checkbox" id="wz-vba" checked> <span data-t="wzIncludeVba"></span></label>
        <label class="opt"><input type="checkbox" id="wz-sheets" checked> <span data-t="wzIncludeSheets"></span></label>
        <label class="opt indent"><span data-t="wzSampleRows"></span>
          <select id="wz-rows"><option value="0"></option><option value="3">3</option><option value="5">5</option><option value="10">10</option></select>
        </label>
        <p class="muted indent" data-t="wzPrivacy"></p>
        <button type="button" id="wz-save-text"><i class="fa-regular fa-floppy-disk"></i> <span data-t="wzSaveText"></span></button>
      </section>

      <section class="port-only">
        <h3 data-t="wzInput"></h3>
        <label class="opt"><input type="radio" name="wz-input" value="yes"> <span data-t="wzYes"></span></label>
        <label class="opt"><input type="radio" name="wz-input" value="no"> <span data-t="wzInputNo"></span></label>
        <label class="opt"><input type="radio" name="wz-input" value="auto" checked> <span data-t="wzAuto"></span></label>
        <input type="text" id="wz-input-note">
        <h3 data-t="wzOutput"></h3>
        <label class="opt"><input type="radio" name="wz-output" value="yes"> <span data-t="wzYes"></span></label>
        <label class="opt"><input type="radio" name="wz-output" value="no"> <span data-t="wzOutputNo"></span></label>
        <label class="opt"><input type="radio" name="wz-output" value="auto" checked> <span data-t="wzAuto"></span></label>
        <input type="text" id="wz-output-note">
      </section>

      <section>
        <h3 data-t="wzMode"></h3>
        <label class="opt"><input type="radio" name="wz-mode" value="script"> <span data-t="wzModeScript"></span></label>
        <label class="opt"><input type="radio" name="wz-mode" value="app"> <span data-t="wzModeApp"></span></label>
        <label class="opt"><input type="radio" name="wz-mode" value="auto" checked> <span data-t="wzAutoMode"></span></label>
      </section>

      <section class="no-app">
        <h3 data-t="wzForm"></h3>
        <label class="opt"><input type="radio" name="wz-form" value="yes"> <span data-t="wzFormYes"></span></label>
        <label class="opt"><input type="radio" name="wz-form" value="no"> <span data-t="wzFormNo"></span></label>
        <label class="opt"><input type="radio" name="wz-form" value="auto" checked> <span data-t="wzAuto"></span></label>
      </section>

      <section>
        <h3 data-t="wzName"></h3>
        <label class="opt"><input type="radio" name="wz-name-mode" value="name"> <span data-t="wzNameGiven"></span></label>
        <input type="text" id="wz-name" class="indent-input">
        <label class="opt"><input type="radio" name="wz-name-mode" value="auto" checked> <span data-t="wzNameAuto"></span></label>
        <label class="opt"><input type="radio" name="wz-name-mode" value="later"> <span data-t="wzNameLater"></span></label>
      </section>

      <section>
        <h3 data-t="wzFolder"></h3>
        <div class="url-row">
          <input type="text" id="wz-folder" spellcheck="false">
          <button type="button" id="wz-folder-pick" data-t="wzChoose"></button>
        </div>
      </section>

      <section>
        <h3 id="wz-overview-title"></h3>
        <textarea id="wz-overview" rows="6"></textarea>
        <p id="wz-error" class="error-text" hidden></p>
      </section>

      <section>
        <label class="opt"><input type="checkbox" id="wz-intro" checked> <span data-t="wzIntro"></span></label>
        <div class="row">
          <button type="button" id="wz-make" class="primary"><i class="fa-solid fa-wand-magic-sparkles"></i> <span data-t="wzMake"></span></button>
          <button type="button" id="wz-cancel" data-t="wzCancel"></button>
        </div>
      </section>

      <section id="wz-result" hidden>
        <h3 data-t="wzPrompt"></h3>
        <p class="muted" id="wz-count"></p>
        <textarea id="wz-text" rows="16" spellcheck="false"></textarea>
        <div class="row">
          <button type="button" id="wz-create" class="primary"><i class="fa-regular fa-clipboard"></i> <span data-t="wzCreate"></span></button>
          <button type="button" id="wz-copy"><span data-t="wzCopyOnly"></span></button>
        </div>
        <p class="muted" data-t="wzAfter"></p>
      </section>
    </div>

    <div id="panel-code" class="panel">
      <div class="bar">
        <select id="file-select"></select>
        <span id="save-state" class="muted"></span>
        <span class="spacer"></span>
        <button type="button" id="btn-save" class="tool"><i class="fa-regular fa-floppy-disk"></i><span data-t="save"></span></button>
      </div>
      <div class="editor">
        <div id="code"></div>
      </div>
    </div>

    <div id="panel-diff" class="panel">
      <div class="bar">
        <span id="diff-title"></span>
        <select id="diff-target" hidden></select>
        <label id="diff-rename-label" class="check" hidden><input type="checkbox" id="diff-rename" checked> <span id="diff-rename-text"></span></label>
        <span id="diff-stats" class="stats"></span>
        <span class="spacer"></span>
        <button type="button" id="diff-apply" class="primary"><i class="fa-solid fa-check"></i> <span id="diff-apply-label"></span></button>
        <button type="button" id="diff-discard"><span data-t="discard"></span></button>
      </div>
      <p id="diff-empty" class="hint muted" data-t="diffEmpty"></p>
      <div id="diff" class="diff"></div>
    </div>

    <div id="panel-preview" class="panel">
      <div class="bar">
        <span id="preview-title"></span>
        <span class="spacer"></span>
        <button type="button" id="preview-refresh" class="tool"><i class="fa-solid fa-rotate-right"></i><span id="preview-refresh-label"></span></button>
      </div>
      <p id="preview-hint" class="hint muted"></p>
      <pre id="preview-error" class="error-box" hidden></pre>
      <iframe id="preview-frame" title="preview" hidden></iframe>
    </div>

    <div id="panel-history" class="panel">
      <div class="bar"><span id="history-title"></span></div>
      <p class="hint muted" data-t="historyLead"></p>
      <ul id="history" class="history"></ul>
    </div>

    <div id="panel-output" class="panel">
      <div class="bar">
        <span id="run-state"></span>
        <span class="spacer"></span>
        <button type="button" id="output-clear" class="tool"><i class="fa-solid fa-eraser"></i><span data-t="clear"></span></button>
      </div>
      <div id="failure" class="failure" hidden>
        <h3 id="failure-title"></h3>
        <button type="button" id="failure-at" class="link" hidden></button>
        <pre id="failure-message" class="error-box"></pre>
        <div class="row">
          <button type="button" id="failure-copy" class="primary"><i class="fa-regular fa-clipboard"></i> <span data-t="copyPrompt"></span></button>
          <label class="check"><input type="checkbox" id="failure-full"> <span data-t="includeCode"></span></label>
        </div>
        <p class="muted" data-t="copyHint"></p>
      </div>
      <pre id="output" class="output"></pre>
    </div>
  </section>
</div>

<footer>
  <span id="status" class="status"></span>
</footer>
<script src="vendor/codemirror/codemirror.js"></script>
<script src="dev-types.js"></script>
<script src="dev-editor.js"></script>
<script src="dev-diff.js"></script>
<script src="dev.js"></script>
</body>
</html>
